      :root {
        --background: #fff;
        --foreground: #0a0a0a;
        --card: #fff;
        --card-foreground: #0a0a0a;
        --popover: #fff;
        --popover-foreground: #0a0a0a;
        --primary: #171717;
        --primary-foreground: #fafafa;
        --secondary: #f5f5f5;
        --secondary-foreground: #171717;
        --muted: #f5f5f5;
        --muted-foreground: #696969;
        --accent: #f5f5f5;
        --accent-foreground: #171717;
        --border: #e5e5e5;
        --input: #e5e5e5;
        --ring: #a1a1a1;
        --sidebar: #fafafa;
        --sidebar-foreground: #0a0a0a;
        --sidebar-accent: #f5f5f5;
        --sidebar-accent-foreground: #171717;
        --sidebar-border: #e5e5e5;
        --radius: 0.625rem;
        --status-success: #147638;
        --status-warning: #ca8a04;
        --destructive: #e40014;
      }
      [data-theme='dark'] {
        --background: #0a0a0a;
        --foreground: #f0f0f0;
        --card: #171717;
        --card-foreground: #f0f0f0;
        --popover: #171717;
        --popover-foreground: #f0f0f0;
        --primary: #e5e5e5;
        --primary-foreground: #171717;
        --secondary: #262626;
        --secondary-foreground: #f0f0f0;
        --muted: #262626;
        --muted-foreground: #acacac;
        --accent: #404040;
        --accent-foreground: #f0f0f0;
        --border: rgb(255 255 255 / 0.07);
        --input: rgb(255 255 255 / 0.15);
        --ring: #737373;
        --sidebar: #171717;
        --sidebar-foreground: #f0f0f0;
        --sidebar-accent: #262626;
        --sidebar-accent-foreground: #f0f0f0;
        --sidebar-border: rgb(255 255 255 / 0.07);
        --status-success: #86efac;
        --status-warning: #eab308;
        --destructive: #ff6568;
        color-scheme: dark;
      }
      [data-theme='light'] {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: Geist, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        letter-spacing: -0.01em;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button,
      input,
      select,
      textarea {
        color: inherit;
      }
      button {
        background: none;
        border: 0;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 3px;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      svg.icon {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
        vertical-align: middle;
      }
      svg.sprite {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
      }
      .muted {
        color: var(--muted-foreground);
      }
      .lab-header {
        height: 72px;

      .icon-demo {

        justify-content: center;
        gap: 8px;
        background: var(--primary);

        font-weight: 500;
        width: 100%;
        padding: 10px 12px;
        border-radius: calc(var(--radius) * 0.8);

      .notes .worktree-label {
        margin-top: 10px;

        line-height: 1.8;
        margin-top: 14px;

        gap: 10px;

        padding: 0 28px 22px;

        justify-content: center;

        min-width: 0;

        margin-top: 13px;

        margin: 0 auto 18px;
        font-size: 12px;
        color: var(--muted-foreground);

        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);

        color: var(--popover-foreground);

        border-radius: calc(var(--radius) * 1.4);
        box-shadow: 0 10px 24px rgb(0 0 0/0.18);
        padding: 13px 18px;
        font-size: 13px;
        max-width: calc(100% - 32px);
        z-index: 20;

        position: fixed;
        background: var(--popover);
        color: var(--popover-foreground);
        border: 1px solid var(--border);

        padding: 5px;
        box-shadow: 0 10px 24px rgb(0 0 0/0.18);
        width: 204px;
        z-index: 15;

        align-items: center;
        gap: 9px;
        text-align: left;
        width: 100%;
        padding: 8px 9px;
        border-radius: calc(var(--radius) * 0.6);
        font-size: 12px;

      .context-menu button:hover {
        background: var(--accent);
        color: var(--accent-foreground);

      .context-menu .icon {
        height: 14px;
        width: 14px;

        height: 1px;

        max-width: calc(100% - 32px);

        }

        }

          worktree: 'develop',

          state: 'done',

          title: 'Revisar atalhos',
          project: 'orca',
          worktree: 'oystercatcher',
          time: 'ontem',
          date: 'Ontem',
          state: 'done',
          preview: 'Atalhos para as ações mais frequentes.',
          prompt: 'Revise os atalhos das ações mais frequentes.'

        {

          title: 'Preparar próxima publicação',

          preview: 'Planejamento da próxima publicação.',

        approved: null

      const filters = {

      let menuConversation = null,

          (c) =>

            (f.project === 'all' || c.project === f.project) &&
            (!query ||
              `${c.title} ${c.project} ${c.worktree || ''}`
                .toLocaleLowerCase('pt-BR')
                .includes(query)) &&
            (version !== 'context' || f.tab !== 'pinned' || c.pinned) &&
            (version !== 'flow' || f.tab === 'all' || f.tab === c.state)

      function list(version) {
        const items = filtered(version)

              const group = items.filter((c) =>

          (pinned.length
            ? groupHeading('Fixadas', 'pin') + pinned.map((c) => row(c, version)).join('')

          ['Hoje', 'Ontem', 'Esta semana']
            .map((date) => {
              const group = normal.filter((c) => c.date === date)
              return group.length
                ? groupHeading(date) + group.map((c) => row(c, version)).join('')
                : ''
            })
            .join('')
        )
      }
      function search(version) {
        return `<label class="search-box">${icon('search')}<input type="search" aria-label="Buscar conversas, projetos ou worktrees" placeholder="Buscar conversas" data-search="${version}" value="${esc(filters[version].query)}"></label>`
      }

        const v = versions[version],
          f = filters[version]
        const active = conversations.filter((c) => c.state === 'active' && !c.archived).length

        if (version === 'context')
          header = `<div class="side-brand"><div class="wordmark">orca</div><div class="head-tools">${ib('square-pen', 'Nova conversa', 'new')}${ib('panel-left-close', 'Recolher sidebar', 'collapse')}</div></div>${search(version)}<button class="new-text" data-action="new">${icon('square-pen')}<span>Nova conversa</span></button>${scope(version)}<div class="tabs" aria-label="Tipo de conversa"><button data-tab="recent" aria-pressed="${f.tab === 'recent'}">Recentes</button><button data-tab="pinned" aria-pressed="${f.tab === 'pinned'}">Fixadas</button></div>`
        else if (version === 'flow')
          header = `<div class="side-brand"><div class="wordmark">${icon('messages-square')}<span>Conversas</span></div>${ib('square-pen', 'Nova conversa', 'new')}</div>${search(version)}<div class="mini-filters" aria-label="Estado da conversa"><button data-tab="all" aria-pressed="${f.tab === 'all'}">Todas</button><button data-tab="attention" aria-pressed="${f.tab === 'attention'}">Pendentes</button><button data-tab="active" aria-pressed="${f.tab === 'active'}">Em andamento</button></div>`
        else
          header = `<div class="side-brand"><div class="wordmark">orca</div>${ib('panel-left-close', 'Recolher sidebar', 'collapse')}</div><button class="primary" data-action="new">${icon('square-pen')}Nova conversa</button>${search(version)}${scope(version)}`
        return `<aside class="sidebar ${version}" data-sidebar="${version}" ${compare ? 'data-compare="true"' : ''}><div class="side-head">${header}</div><div class="side-scroll" data-list="${version}">${list(version)}</div><div class="side-footer"><div class="side-status"><span class="state-dot"></span><button data-action="show-active">${active} conversa${active !== 1 ? 's' : ''} em andamento</button></div><button class="side-nav" data-action="tasks">${icon('list-checks')}<span>Tarefas</span></button><button class="side-nav" data-action="tools">${icon('blocks')}<span>Ferramentas</span><span class="push">${icon('chevron-down')}</span></button><div class="footer-divider"></div><div class="profile"><span class="avatar">BR</span><div class="profile-info">Bruno<span>Espaço pessoal</span></div>${ib('settings-2', 'Configurações', 'settings')}</div></div></aside>`
      }
      function conversationContent() {
        const c = selected()
        if (!c) return ''

            artifacts: ['files', 'Artefatos', 'Aqui ficam os arquivos produzidos nas conversas.'],

              'layout-grid',
              'Painel de agentes',
              'Aqui você acompanha os agentes em execução.'

            settings: ['settings-2', 'Configurações', 'Aqui você ajusta o seu espaço de trabalho.'],

          const t = tools[state.route] || tools.tasks

            state.route === 'archive'

                      `<button class="side-nav" data-action="restore" data-restore-id="${c.id}">${icon('archive-restore')}Restaurar ${esc(c.title)}</button>`

                  .join('')

<button class="icon-btn send" type="submit" aria-label="Enviar mensagem de demonstração">${icon('arrow-up')}</button></div></form><p class="composer-caption">Protótipo interativo · nenhuma mensagem é enviada a um modelo</p></div></section>`

          localStorage.setItem(
            'orca-conversation-prototype-preferences',

              width: state.width,
              notes: state.notes
            })

        } catch {}
      }
      function toast(text) {

        box.hidden = false
        toastTimer = setTimeout(() => (box.hidden = true), 5000)

      function closeMenu() {

        menu.innerHTML = ''

      function menuAt(button, items) {
        const menu = document.querySelector('#menu')

        menu.hidden = false

        menu.style.left = Math.max(8, Math.min(rect.right - 204, innerWidth - 212)) + 'px'
        menu.style.top =
          Math.max(8, Math.min(rect.bottom + 5, innerHeight - menu.offsetHeight - 12)) + 'px'
        menu.querySelector('button')?.focus()
      }
      const menuItem = (i, text, action) =>
        `<button role="menuitem" data-action="${action}">${icon(i)}${text}</button>`
      function conversationMenu(button, id) {
        menuConversation = id
        const c = conversations.find((c) => c.id === id)
        menuAt(
          button,
          menuItem('pin', c.pinned ? 'Desafixar conversa' : 'Fixar conversa', 'pin') +
            menuItem('pencil', 'Renomear', 'rename') +
            '<div class="menu-line"></div>' +
            menuItem('archive', 'Arquivar conversa', 'archive-conversation')

      }
      function setVersion(version) {
        state.version = version

        try {
          history.replaceState(null, '', '#' + version)
        } catch {}
      }
      document.addEventListener('input', (e) => {
        const version = e.target.dataset.search
        if (!version) return
        filters[version].query = e.target.value
        updateLists(version)

      document.addEventListener('change', (e) => {
        if (e.target.dataset.scope) {
          const v = e.target.dataset.scope
          filters[v].project = e.target.value
          updateLists(v)
        }
        if (e.target.id === 'width-select') {
          state.width = Number(e.target.value)
          renderApp()
        }
      })
      document.addEventListener('click', (e) => {
        const b = e.target.closest('button')
        if (!b) {
          if (!e.target.closest('#menu')) closeMenu()
          return
        }
        if (b.dataset.version) {
          setVersion(b.dataset.version)
          return
        }
        if (b.dataset.openVersion) {
          setVersion(b.dataset.openVersion)
          return
        }
        if (b.id === 'theme-toggle') {
          state.theme = state.theme === 'dark' ? 'light' : 'dark'
          render()
          return
        }
        if (b.id === 'notes-toggle') {
          state.notes = !state.notes
          b.textContent = state.notes ? 'Ocultar notas' : 'Mostrar notas'
          b.setAttribute('aria-pressed', String(state.notes))
          render()
          return
        }
        if (b.id === 'fullscreen') {
          if (!document.fullscreenElement)
            document.documentElement
              .requestFullscreen()
              .catch(() => toast('Use a opção de tela cheia do seu navegador.'))
          else document.exitFullscreen()
          return
        }
        const side = b.closest('[data-sidebar]'),
          version = side?.dataset.sidebar || state.version
        if (b.dataset.tab) {
          filters[version].tab = b.dataset.tab
          side
            .querySelectorAll('[data-tab]')
            .forEach((x) => x.setAttribute('aria-pressed', String(x === b)))
          updateLists(version)
          return
        }
        const action = b.dataset.action
        if (!action) {
          if (!b.closest('#menu')) closeMenu()
          return
        }
        if (action === 'row-menu') {
          conversationMenu(b, b.closest('[data-id]').dataset.id)
          return
        }
        if (action === 'current-menu') {
          conversationMenu(b, state.selected)
          return
        }
        if (action === 'tools') {
          menuAt(
            b,
            menuItem('files', 'Artefatos', 'artifacts') +
              menuItem('book-open', 'Skills', 'skills') +
              menuItem('zap', 'Automações', 'automations') +
              menuItem('layout-grid', 'Painel de agentes', 'agents') +
              '<div class="menu-line"></div>' +
              menuItem('archive', 'Conversas arquivadas', 'archive')
          )
          return
        }
        if (action === 'conversation') {
          state.selected = b.closest('[data-id]').dataset.id
          state.route = null
          document.querySelectorAll('.conversation').forEach((r) => {
            const current = r.dataset.id === state.selected
            r.dataset.current = String(current)
            const main = r.querySelector('.conversation-main')
            if (current) main.setAttribute('aria-current', 'page')
            else main.removeAttribute('aria-current')
          })
          if (state.version !== 'compare') {
            const pane = document.querySelector('#app .content-pane')
            pane.outerHTML = conversationContent()
          } else
            toast(`Conversa selecionada: ${selected().title}. Abra uma versão para ver o conteúdo.`)
          return
        }
        if (action === 'collapse') {
          if (state.version === 'compare') {
            setVersion(version)
            state.collapsed = true
            renderApp()
          } else {
            state.collapsed = !state.collapsed
            renderApp()
          }
          return
        }
        if (action === 'expand-search') {
          state.collapsed = false
          renderApp()
          document.querySelector('#app input[type="search"]')?.focus()
          return
        }
        if (action === 'new') {
          const base = selected()
          const c = {
            id: 'new-' + Date.now(),
            title: 'Nova conversa',
            project: base?.project || 'orca',
            worktree: base?.worktree ?? null,
            time: 'agora',
            date: 'Hoje',
            state: 'idle',
            pinned: false,
            preview: 'Uma nova conversa no contexto atual.',
            prompt: ''
          }
          conversations.unshift(c)
          state.selected = c.id
          state.route = null
          if (state.version === 'compare') state.version = version
          filters[state.version] = {
            query: '',
            project: 'all',
            tab: state.version === 'flow' ? 'all' : 'recent'
          }
          state.collapsed = false
          render()
          document.querySelector('#app textarea')?.focus()
          return
        }
        if (action === 'show-active') {
          if (version === 'flow') {
            filters.flow.tab = 'active'
            if (state.version === 'compare') {
              const s = b.closest('[data-sidebar]')
              s.querySelectorAll('[data-tab]').forEach((t) =>
                t.setAttribute('aria-pressed', String(t.dataset.tab === 'active'))
              )
              updateLists('flow')
            } else renderApp()
          } else {
            const active = conversations.find((c) => c.state === 'active' && !c.archived)
            if (active) {
              state.selected = active.id
              state.route = null
              if (state.version === 'compare') setVersion(version)
              else renderApp()
            }
          }
          return
        }
        if (action === 'pin') {
          const c = conversations.find((c) => c.id === menuConversation)
          c.pinned = !c.pinned
          render()
          toast(c.pinned ? 'Conversa fixada no protótipo.' : 'Conversa desafixada no protótipo.')
          return
        }
        if (action === 'rename') {
          renameId = menuConversation
          const c = conversations.find((c) => c.id === renameId)
          closeMenu()
          document.querySelector('#rename-input').value = c.title
          document.querySelector('#rename-dialog').showModal()
          document.querySelector('#rename-input').select()
          return
        }
        if (action === 'cancel-rename') {
          document.querySelector('#rename-dialog').close()
          return
        }
        if (action === 'archive-conversation') {
          const c = conversations.find((c) => c.id === menuConversation)
          c.archived = true
          if (c.id === state.selected) state.selected = conversations.find((c) => !c.archived)?.id
          if (state.version === 'compare') render()
          else {
            state.route = 'archive'
            render()
          }
          toast('Conversa arquivada no protótipo. Você pode restaurá-la em Ferramentas.')
          return
        }
        if (action === 'restore') {
          conversations.find((c) => c.id === b.dataset.restoreId).archived = false
          render()
          toast('Conversa restaurada no protótipo.')
          return
        }
        if (
          ['tasks', 'skills', 'artifacts', 'automations', 'agents', 'settings', 'archive'].includes(
            action
          )
        ) {
          state.route = action
          if (state.version === 'compare') state.version = version
          render()
          return
        }
        if (action === 'back') {
          state.route = null
          renderApp()
          return
        }
        if (action === 'approve') {
          state.approved = state.version
          toast(
            `Você marcou ${versions[state.version].name}. Diga no chat qual versão aprova para iniciarmos a implementação.`
          )
          b.innerHTML = icon('check') + 'Versão selecionada'
          return
        }
        if (action === 'copy') {
          navigator.clipboard
            ?.writeText('A conversa fica no centro da navegação. O worktree acompanha a conversa.')
            .then(() => toast('Texto do exemplo copiado.'))
            .catch(() => toast('A cópia não foi permitida pelo navegador.'))
          return
        }
        if (['history', 'repeat', 'attach'].includes(action)) {
          toast('Demonstração visual: nenhuma ação é executada no seu ambiente.')
          return
        }
        closeMenu()
      })
      document.querySelector('#rename-form').addEventListener('submit', (e) => {
        e.preventDefault()
        const name = document.querySelector('#rename-input').value.trim()
        if (!name) return
        conversations.find((c) => c.id === renameId).title = name
        document.querySelector('#rename-dialog').close()
        render()
        toast('Conversa renomeada no protótipo.')
      })
      document.addEventListener('submit', (e) => {
        if (!e.target.matches('[data-composer]')) return
        e.preventDefault()
        toast('Mensagem de demonstração. Nenhuma solicitação foi enviada.')
      })
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeMenu()
          document.querySelector('#toast').hidden = true
        }
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          const menu = document.querySelector('#menu')
          if (!menu.hidden) {
            e.preventDefault()
            const items = [...menu.querySelectorAll('button')]
            let index = items.indexOf(document.activeElement)
            index = (index + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length
            items[index].focus()
          }
        }
      })
      try {
        const saved = JSON.parse(
          localStorage.getItem('orca-conversation-prototype-preferences') || 'null'
        )
        if (saved) {
          if (versions[saved.version] || saved.version === 'compare') state.version = saved.version
          if (['light', 'dark'].includes(saved.theme)) state.theme = saved.theme
          if ([280, 320, 360].includes(saved.width)) state.width = saved.width
          if (typeof saved.notes === 'boolean') state.notes = saved.notes
        }
      } catch {}
      const hash = location.hash.slice(1)
      if (versions[hash] || hash === 'compare') state.version = hash
      document.querySelector('#width-select').value = String(state.width)
      render()
    </script>
